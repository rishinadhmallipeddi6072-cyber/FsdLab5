<!DOCTYPE html>
<html>
<head>

    <title>Login</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding-top: 100px;
        }

        .login-box {
            background-color: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 30px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>Login</h1>

    <form action="login" method="post">

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <br>

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
